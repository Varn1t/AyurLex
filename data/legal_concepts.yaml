# ---------------------------------------------------------------------------
# International layer.
#
# SIH26045 requires the national and the international regimes to be kept
# "visibly separate" so that answers are never conflated. These concepts point
# only at non-IN instruments; the retriever tags the jurisdiction of what they
# return, and a treaty record carries a note saying what force it actually has
# in India, because "India is a Party to Nagoya" and "you can sue on Nagoya in
# Delhi" are very different statements.
# ---------------------------------------------------------------------------

