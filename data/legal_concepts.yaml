# Concept lexicon: the bridge between how a question is asked and how a statute
# is written.
#
# A vaidya asks "can I patent my family formulation?". The provision that
# answers it is headed "What are not inventions" and never uses the word
# "formulation". No amount of embedding tuning closes that gap reliably,
# because the gap is not semantic drift -- it is a different register.
#
# So the mapping is curated data, not a prompt and not a guess:
#   lay        -- how people actually ask, including Hindi/Devanagari forms
#   statutory  -- the terms the drafter used, appended to the query
#   provisions -- the corpus ids this concept is governed by
#   rules      -- the SUTRA rules that decide it, so chat can offer a compile
#
# A provision id may carry a pin-cite: 'IN.PATENTS.1970::S3(p)' means the
# concept is governed by clause (p) specifically, so the answer quotes that
# clause rather than reciting the whole of section 3.
#
# Every provision id here is verified by the same loader gate as the rules:
# scripts/verify_concepts.py fails if one stops resolving. Adding a concept is
# a data change reviewable by a domain expert who does not read Python.

