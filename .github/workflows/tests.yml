name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # The corpus is generated from the tracked PDFs in Dataset/, not committed.
      - run: python samhita/ingest.py
      - run: python samhita/priorart.py
      - run: python samhita/schedules.py
      - run: python -m pytest -q
